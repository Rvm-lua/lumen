<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="Lumen — des milliers de films du domaine public, issus d'Internet Archive.">
<meta name="theme-color" content="#0d0b13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://archive.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Salle de projection : une lumière ambrée (le projecteur) sur une encre violacée */
:root{
  --ink:#0d0b13; --ink-2:#15121d; --ink-3:#201c2a; --ink-4:#2c2738;
  --line:rgba(236,226,255,.09); --fg:#f1ecf7; --muted:#a39bb2; --dim:#6f6880;
  --beam:#f4c47d; --beam-ink:#2a1a05; --err:#ff8a7a;
  --f-display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1); --out:cubic-bezier(.22,1,.36,1);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (min-width:900px){:root{--gut-l:max(48px,env(safe-area-inset-left,0px)); --gut-r:max(48px,env(safe-area-inset-right,0px))}}
*{box-sizing:border-box}
html,body{margin:0; background:var(--ink); color:var(--fg)}
body{font-family:var(--f-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; padding-top:env(safe-area-inset-top,0px)}
body.locked{overflow:hidden}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--ink)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
a{color:var(--beam)}
:focus-visible{outline:2px solid var(--beam); outline-offset:3px; border-radius:6px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.grain{position:absolute; inset:0; pointer-events:none; background-image:var(--grain); opacity:.1; mix-blend-mode:overlay}

/* header */
.top{position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:50; display:flex; align-items:center; gap:28px; padding-block:16px; padding-left:var(--gut-l); padding-right:var(--gut-r);
  background:linear-gradient(to bottom,rgba(13,11,19,.85),rgba(13,11,19,0)); transition:background .4s var(--out)}
.top.solid{background:rgba(13,11,19,.74); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); box-shadow:0 1px 0 var(--line)}
.logo{font-family:var(--f-display); font-weight:800; font-size:24px; letter-spacing:-.03em; display:flex; align-items:center; gap:8px}
.logo i{width:12px; height:12px; border-radius:50%; background:var(--beam); box-shadow:0 0 18px 4px rgba(244,196,125,.45); display:block}
.nav{display:flex; gap:4px}
.nav button{padding:8px 14px; border-radius:999px; color:var(--muted); font-weight:500; transition:color .25s,background .25s}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg); background:rgba(255,255,255,.08)}
.top .sp{flex:1}
.icon-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; transition:background .2s,transform .2s var(--out)}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px}
.kbd{font-family:var(--f-mono); font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:5px; padding:1px 6px}
.searchpill{display:flex; align-items:center; gap:10px; height:40px; padding:0 12px 0 14px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--muted); border:1px solid var(--line); transition:background .2s}
.searchpill:hover{background:rgba(255,255,255,.1)}
.searchpill svg{width:17px; height:17px}
.avatar{width:36px; height:36px; border-radius:10px; background:conic-gradient(from 200deg,#f4c47d,#c36a8f,#6b5bd6,#f4c47d); font-family:var(--f-display); font-weight:700; color:#160e1f; display:grid; place-items:center}
.menu{position:absolute; top:62px; right:var(--gut-r); width:280px; background:var(--ink-3); border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:0 24px 60px rgba(0,0,0,.5); transform-origin:top right; animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0; transform:scale(.94) translateY(-6px)}}
.menu .row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:10px}
.menu small{display:block; color:var(--dim); font-size:12px}
.switch{width:38px; height:22px; border-radius:999px; background:var(--ink-4); position:relative; flex:none; transition:background .25s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--fg); transition:transform .3s var(--ease)}
.switch[aria-checked="true"]{background:var(--beam)}
.switch[aria-checked="true"]::after{transform:translateX(16px); background:var(--beam-ink)}

/* hero */
.hero{position:relative; min-height:clamp(500px,76vh,760px); display:flex; align-items:flex-end; overflow:hidden; isolation:isolate}
.hero .bg{position:absolute; inset:-40px; z-index:-2}
.hero .bg img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(38px) saturate(1.4) brightness(.7); opacity:0; transform:scale(1.1); transition:opacity 1.2s var(--out)}
.hero .bg img.on{opacity:1}
.hero::after{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(13,11,19,.95) 0%,rgba(13,11,19,.6) 45%,rgba(13,11,19,.15) 80%),linear-gradient(0deg,var(--ink) 0%,rgba(13,11,19,0) 40%)}
.hero-in{width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:40px; align-items:end; padding-left:var(--gut-l); padding-right:var(--gut-r); padding-block:120px 64px}
.hero-txt{display:grid; gap:18px; max-width:720px}
.frame{width:clamp(220px,24vw,340px); aspect-ratio:4/3; border-radius:14px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08); transform:rotate(1.5deg); max-width:100%}
.frame img{width:100%; height:100%; object-fit:cover; display:block}
.eyebrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--beam)}
.eyebrow b{padding:3px 8px; border-radius:6px; background:rgba(244,196,125,.14); letter-spacing:.08em}
.hero h1{font-family:var(--f-display); font-weight:800; font-size:clamp(38px,6.4vw,82px); line-height:.94; letter-spacing:-.035em; margin:0; text-wrap:balance}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; color:var(--muted); font-size:14px}
.pill{font-family:var(--f-mono); font-size:11px; border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:1px 6px; color:var(--fg)}
.hero p{margin:0; color:#d7d0e2; font-size:16px; max-width:58ch; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.swap > *{animation:rise .8s var(--out) both}
.swap > *:nth-child(2){animation-delay:.05s}.swap > *:nth-child(3){animation-delay:.1s}.swap > *:nth-child(4){animation-delay:.15s}.swap > *:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0; transform:translateY(14px); filter:blur(6px)}}
.frame.swap{animation:frameIn .9s var(--ease) both}
@keyframes frameIn{from{opacity:0; transform:rotate(4deg) translateY(20px) scale(.96)}}
.actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:6px}
.btn{display:inline-flex; align-items:center; gap:10px; height:50px; padding:0 24px 0 20px; border-radius:14px; font-weight:600; font-size:16px; transition:transform .25s var(--out),background .25s,box-shadow .3s; text-decoration:none; color:var(--fg)}
.btn svg{width:22px; height:22px}
.btn:active{transform:scale(.96)}
.btn.play{background:var(--beam); color:var(--beam-ink); box-shadow:0 10px 40px -10px rgba(244,196,125,.7)}
.btn.play:hover{box-shadow:0 14px 50px -8px rgba(244,196,125,.9); transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.12)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.dots{position:absolute; right:var(--gut-r); bottom:30px; display:flex; gap:8px}
.dots button{width:28px; height:4px; border-radius:4px; background:rgba(255,255,255,.22); overflow:hidden; position:relative; transition:width .4s var(--ease)}
.dots button.on{width:56px}
.dots button.on::after{content:""; position:absolute; inset:0; background:var(--fg); transform-origin:left; animation:fill var(--dur,9s) linear forwards}
.hero.paused .dots button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}}

/* rows */
main{position:relative; z-index:2; padding-bottom:80px}
.section{margin-top:30px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-left:var(--gut-l); padding-right:var(--gut-r); margin-bottom:10px}
.sec-head h2{font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin:0}
.sec-head button{color:var(--dim); font-size:13px; transition:color .2s}
.sec-head button:hover{color:var(--beam)}
.rail-wrap{position:relative}
.rail{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-left:var(--gut-l); padding-left:var(--gut-l); padding-right:var(--gut-r); padding-block:10px 22px; scrollbar-width:none; overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.arrow{position:absolute; top:10px; bottom:22px; width:var(--gut-l); min-width:44px; display:grid; place-items:center; z-index:4; opacity:0; transition:opacity .25s}
.arrow.l{left:0; background:linear-gradient(90deg,rgba(13,11,19,.9),rgba(13,11,19,0))}
.arrow.r{right:0; background:linear-gradient(270deg,rgba(13,11,19,.9),rgba(13,11,19,0))}
.arrow svg{width:28px; height:28px; transition:transform .25s var(--out)}
.arrow:hover svg{transform:scale(1.2)}
@media (hover:hover){.rail-wrap:hover .arrow:not([disabled]){opacity:1}}
.arrow[disabled]{pointer-events:none}

.card{flex:none; width:clamp(230px,23vw,320px); scroll-snap-align:start; position:relative; text-align:left; transition:transform .45s var(--ease); z-index:1}
.art{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--ink-3); max-width:100%}
.art .blur{position:absolute; inset:-20px; width:calc(100% + 40px); height:calc(100% + 40px); object-fit:cover; filter:blur(18px) brightness(.6) saturate(1.3)}
.art .fg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transition:transform .6s var(--ease)}
.art::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0) 55%)}
.art .t{position:absolute; left:14px; right:14px; bottom:11px; z-index:2; font-family:var(--f-display); font-weight:800; font-size:19px; line-height:1.02; letter-spacing:-.02em; text-shadow:0 2px 16px rgba(0,0,0,.7); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.art .yr{position:absolute; top:9px; right:9px; z-index:2; font-family:var(--f-mono); font-size:11px; padding:2px 7px; border-radius:5px; background:rgba(13,11,19,.7)}
.card .pg{height:3px; border-radius:3px; background:rgba(255,255,255,.18); margin:8px 2px 0; overflow:hidden}
.card .pg i{display:block; height:100%; background:var(--beam)}
.card .sub{font-size:12.5px; color:var(--muted); padding:5px 2px 0}
.card .info{padding:8px 2px 0; max-height:0; opacity:0; overflow:hidden; transition:max-height .45s var(--ease),opacity .3s; font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
@media (hover:hover) and (min-width:700px){
  .card:hover{transform:scale(1.05) translateY(-4px); z-index:5}
  .card:hover .fg{transform:scale(1.04)}
  .card:hover .info{max-height:60px; opacity:1}
}
.skel .art{background:linear-gradient(100deg,var(--ink-3) 30%,var(--ink-4) 50%,var(--ink-3) 70%); background-size:300% 100%; animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0} to{background-position:-50% 0}}

.rank{flex:none; display:flex; align-items:flex-end; scroll-snap-align:start; position:relative; transition:transform .45s var(--ease)}
.rank .n{font-family:var(--f-display); font-weight:800; font-size:clamp(110px,13vw,168px); line-height:.78; letter-spacing:-.08em; color:var(--ink); -webkit-text-stroke:2px rgba(244,196,125,.55); margin-right:-22px; user-select:none}
.rank .art{width:clamp(130px,13vw,170px); aspect-ratio:3/4; box-shadow:-12px 0 30px rgba(0,0,0,.55)}
.rank .art::after{display:none}
@media (hover:hover){.rank:hover{transform:translateY(-6px)} .rank:hover .n{-webkit-text-stroke-color:var(--beam)}}

.page-head{padding-left:var(--gut-l); padding-right:var(--gut-r); padding-block:110px 10px; display:grid; gap:14px}
.page-head h1{font-family:var(--f-display); font-weight:800; font-size:clamp(36px,5vw,60px); letter-spacing:-.035em; margin:0; line-height:1}
.page-head p{margin:0; color:var(--muted); max-width:62ch}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{padding:7px 14px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:13.5px; transition:all .25s var(--out)}
.chip:hover{color:var(--fg); border-color:rgba(255,255,255,.25)}
.chip[aria-pressed="true"]{background:var(--fg); color:var(--ink); border-color:var(--fg)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:22px 14px; padding-left:var(--gut-l); padding-right:var(--gut-r); padding-top:16px}
.grid .card{width:auto}
.status{padding:28px var(--gut-r) 20px var(--gut-l); color:var(--muted); display:grid; gap:10px; justify-items:start}
.status h3{font-family:var(--f-display); font-size:22px; margin:0; color:var(--fg)}
.status.err h3{color:var(--err)}
.view-in{animation:fadeup .55s var(--out) both}
@keyframes fadeup{from{opacity:0; transform:translateY(16px)}}

/* fiche */
.scrim{position:fixed; inset:0; z-index:70; background:rgba(6,5,10,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transition:opacity .4s var(--out); display:flex; justify-content:center; align-items:flex-start; overflow-y:auto;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) 40px; padding-left:var(--gut-l); padding-right:var(--gut-r)}
.scrim.open{opacity:1}
.sheet{width:min(880px,100%); background:var(--ink-2); border-radius:22px; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px var(--line); transform:translateY(40px) scale(.97); opacity:0; transition:transform .55s var(--ease),opacity .4s var(--out); position:relative}
.scrim.open .sheet{transform:none; opacity:1}
.sheet .cover{position:relative; aspect-ratio:16/8; overflow:hidden; max-width:100%}
.sheet .cover .blur{position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(30px) brightness(.55) saturate(1.3)}
.sheet .cover .fg{position:absolute; top:8%; right:6%; height:70%; max-width:50%; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg,var(--ink-2) 4%,rgba(21,18,29,0) 62%),linear-gradient(90deg,rgba(21,18,29,.7),rgba(21,18,29,0) 60%)}
.sheet .close{position:absolute; top:14px; right:14px; z-index:3; background:rgba(13,11,19,.6)}
.cover-in{position:absolute; left:32px; right:32px; bottom:24px; z-index:2; display:grid; gap:16px}
.sheet h2{font-family:var(--f-display); font-weight:800; font-size:clamp(30px,4.6vw,52px); letter-spacing:-.035em; line-height:.96; margin:0; text-wrap:balance; max-width:20ch}
.round{width:50px; height:50px; border-radius:50%; border:1.5px solid rgba(255,255,255,.4); display:grid; place-items:center; background:rgba(13,11,19,.35); transition:all .3s var(--out)}
.round:hover{border-color:var(--fg); background:rgba(255,255,255,.1)}
.round svg{width:22px; height:22px}
.round[aria-pressed="true"]{background:var(--fg); color:var(--ink); border-color:var(--fg)}
.sheet-body{padding:8px 32px 32px; display:grid; gap:28px}
.cols{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:28px}
.desc{margin:0; color:#ddd6e8; font-size:15px; line-height:1.65; max-height:14em; overflow:auto; white-space:pre-line}
.facts{display:grid; gap:10px; font-size:13.5px; color:var(--dim); align-content:start}
.facts b{color:var(--fg); font-weight:500; overflow-wrap:anywhere}
.sheet h3{font-family:var(--f-display); font-size:21px; margin:0; letter-spacing:-.02em}
.similar{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.similar .card{width:auto}
.spin{width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(255,255,255,.2); border-top-color:var(--beam); animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* recherche */
.search{position:fixed; inset:0; z-index:80; background:rgba(13,11,19,.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); overflow-y:auto; opacity:0; transition:opacity .35s var(--out); padding-block:calc(24px + env(safe-area-inset-top,0px)) 60px}
.search.open{opacity:1}
.search-bar{display:flex; align-items:center; gap:14px; padding-left:var(--gut-l); padding-right:var(--gut-r)}
.search-bar svg{width:26px; height:26px; color:var(--beam); flex:none}
#q{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg); font-family:var(--f-display); font-weight:700; font-size:clamp(26px,4vw,44px); letter-spacing:-.03em; caret-color:var(--beam)}
#q::placeholder{color:var(--ink-4)}
.search .hint{padding-left:var(--gut-l); padding-right:var(--gut-r); color:var(--dim); font-size:13px; margin-top:8px; display:flex; align-items:center; gap:10px}

/* lecteur */
.player{position:fixed; inset:0; z-index:90; background:#000; opacity:0; transition:opacity .4s var(--out); cursor:none}
.player.open{opacity:1}
.player.ui{cursor:default}
.player video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.p-ui{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; opacity:0; transition:opacity .45s var(--out); background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 60%,rgba(0,0,0,.85))}
.player.ui .p-ui{opacity:1}
.p-top{display:flex; align-items:center; gap:16px; padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-left:var(--gut-l); padding-right:var(--gut-r)}
.p-top h3{margin:0; font-family:var(--f-display); font-size:20px; letter-spacing:-.02em}
.p-top small{color:var(--muted); font-size:13px}
.p-mid{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.p-flash{width:86px; height:86px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; opacity:0}
.p-flash.go{animation:flash .6s var(--out)}
@keyframes flash{30%{opacity:1; transform:scale(1)} from{transform:scale(.8)} to{opacity:0; transform:scale(1.25)}}
.p-flash svg{width:38px; height:38px}
.p-load{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.p-load .spin{width:54px; height:54px; border-width:3px}
.p-msg{position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:14px; text-align:center; padding:24px; color:var(--muted)}
.p-msg h3{font-family:var(--f-display); color:var(--fg); margin:0; font-size:24px}
.p-bot{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); padding-left:var(--gut-l); padding-right:var(--gut-r); display:grid; gap:10px}
.scrub{position:relative; height:22px; display:flex; align-items:center; cursor:pointer; touch-action:none}
.scrub .tr{position:relative; width:100%; height:4px; border-radius:4px; background:rgba(255,255,255,.22); transition:height .2s var(--out)}
.scrub:hover .tr,.scrub.drag .tr{height:7px}
.scrub .bf{position:absolute; inset:0 auto 0 0; background:rgba(255,255,255,.32); border-radius:4px}
.scrub .fl{position:absolute; inset:0 auto 0 0; background:var(--beam); border-radius:4px}
.scrub .kn{position:absolute; top:50%; width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; background:var(--beam); box-shadow:0 0 0 5px rgba(244,196,125,.25); transform:scale(0); transition:transform .2s var(--out)}
.scrub:hover .kn,.scrub.drag .kn{transform:scale(1)}
.scrub .tip{position:absolute; bottom:24px; transform:translateX(-50%); background:rgba(20,17,28,.92); padding:4px 8px; border-radius:6px; font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none}
.scrub:hover .tip{opacity:1}
.p-ctrl{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
.p-ctrl .time{margin-left:8px; color:#d8d2e2; font-size:13px}
.p-ctrl .sp{flex:1}
.p-ctrl .icon-btn{width:46px; height:46px}
.p-ctrl .icon-btn svg{width:26px; height:26px}
.vol{display:flex; align-items:center}
.vol input{width:0; opacity:0; transition:width .3s var(--ease),opacity .3s; accent-color:var(--beam)}
.vol:hover input,.vol input:focus{width:90px; opacity:1}
.speed{height:34px; padding:0 10px; border-radius:8px; font-family:var(--f-mono); font-size:13px; background:rgba(255,255,255,.1)}
.speed:hover{background:rgba(255,255,255,.2)}

/* toasts */
.toasts{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:100; display:grid; gap:8px; justify-items:center; pointer-events:none}
.toast{display:flex; align-items:center; gap:10px; padding:10px 16px 10px 12px; border-radius:999px; background:var(--fg); color:var(--ink); font-weight:500; font-size:14px; box-shadow:0 14px 40px rgba(0,0,0,.45); animation:tin .5s var(--ease) both; white-space:nowrap}
.toast.out{animation:tout .35s var(--out) forwards}
.toast i{width:22px; height:22px; border-radius:50%; background:var(--beam); display:grid; place-items:center}
.toast svg{width:13px; height:13px; color:var(--beam-ink)}
@keyframes tin{from{opacity:0; transform:translateY(16px) scale(.9)}}
@keyframes tout{to{opacity:0; transform:translateY(8px) scale(.95)}}

.foot{padding:30px var(--gut-r) 40px var(--gut-l); color:var(--dim); font-size:12.5px; border-top:1px solid var(--line); margin-top:40px}

/* mobile */
.tabbar{display:none}
@media (max-width:760px){
  .nav,.searchpill,.avatar{display:none}
  .hero{min-height:clamp(460px,78vh,640px); text-align:center}
  .hero::after{background:linear-gradient(0deg,var(--ink) 4%,rgba(13,11,19,.6) 50%,rgba(13,11,19,.2) 100%)}
  .hero-in{grid-template-columns:minmax(0,1fr); justify-items:center; padding-block:96px 50px}
  .hero-txt{justify-items:center}
  .frame{order:-1; width:min(62vw,260px)}
  .meta{justify-content:center}
  .hero p{font-size:15px}
  .actions{justify-content:center; width:100%}
  .actions .btn{flex:1; justify-content:center; padding:0 16px; max-width:200px}
  .dots{left:0; right:0; justify-content:center; bottom:20px}
  .card{width:68vw}
  .tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:55; justify-content:space-around; padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); padding-left:var(--gut-l); padding-right:var(--gut-r); background:rgba(13,11,19,.85); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 -1px 0 var(--line)}
  .tabbar button{display:grid; justify-items:center; gap:3px; font-size:11px; color:var(--dim); padding:4px 10px}
  .tabbar button svg{width:23px; height:23px; transition:transform .3s var(--ease)}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar button[aria-current="page"] svg{transform:translateY(-2px); color:var(--beam)}
  main{padding-bottom:110px}
  .scrim{padding:0; align-items:flex-end}
  .sheet{border-radius:22px 22px 0 0; transform:translateY(100%); max-height:94%; overflow-y:auto}
  .sheet .cover .fg{display:none}
  .cover-in{left:18px; right:18px}
  .sheet-body{padding:8px 18px 32px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .similar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .vol input{display:none}
}
[data-low-spec="true"] *,[data-low-spec="true"] *::before,[data-low-spec="true"] *::after{backdrop-filter:none!important; -webkit-backdrop-filter:none!important}

<div id="app"></div>

<nav class="tabbar" aria-label="Navigation">

</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain=s=>{if(Array.isArray(s))s=s.join("\n"); s=String(s??""); try{const d=new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n"),"text/html"); return (d.body.textContent||"").replace(/\n{3,}/g,"\n\n").trim()}catch(e){return s.replace(/<[^>]+>/g,"").trim()}};

const I={
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',

 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
 rw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-family="ui-monospace,monospace" fill="currentColor" stroke="none" font-weight="700">10</text></svg>',
 ff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-family="ui-monospace,monospace" fill="currentColor" stroke="none" font-weight="700">10</text></svg>',
 full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
 vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
 mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>',
 ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};

/* ---------- Internet Archive ---------- */
const IA="https://archive.org";
const COLLS=[
 {id:"feature_films",name:"Longs métrages"},
 {id:"Film_Noir",name:"Film noir"},
 {id:"SciFi_Horror",name:"Science-fiction & horreur"},
 {id:"Comedy_Films",name:"Comédies"},
 {id:"silent_films",name:"Cinéma muet"},
 {id:"classic_cartoons",name:"Dessins animés classiques"}
];
const ALL=`collection:(${COLLS.map(c=>c.id).join(" OR ")})`;
const films={}; // cache par identifiant
function norm(d){
  const id=d.identifier; const prev=films[id]||{};
  let y=d.year||(d.date?String(d.date).slice(0,4):""); if(Array.isArray(y))y=y[0];
  const f={...prev,id,title:plain(Array.isArray(d.title)?d.title[0]:d.title)||id,year:y?String(y).slice(0,4):prev.year||"",
    desc:prev.desc||plain(d.description).slice(0,600),dl:+d.downloads||prev.dl||0,runtime:d.runtime?String(Array.isArray(d.runtime)?d.runtime[0]:d.runtime):prev.runtime||"",
    subj:prev.subj||(Array.isArray(d.subject)?d.subject:(d.subject?String(d.subject).split(/[;,]/):[])).map(s=>s.trim()).filter(Boolean).slice(0,4),
    coll:prev.coll||d._coll||""};
  return films[id]=f;
}
const thumb=id=>`${IA}/services/img/${encodeURIComponent(id)}`;
async function iaSearch({q="",coll="",sort="downloads desc",rows=30,page=1,signal}={}){
  let query=`mediatype:movies AND ${coll?`collection:${coll}`:ALL}`;
  if(q){const clean=q.replace(/[^\p{L}\p{N}\s'-]/gu," ").trim(); if(clean)query+=` AND (title:(${clean}) OR subject:(${clean}) OR creator:(${clean}))`}
  const p=new URLSearchParams({q:query,rows:String(rows),page:String(page),output:"json"});
  ["identifier","title","year","date","downloads","subject","description","runtime"].forEach(f=>p.append("fl[]",f)); p.append("sort[]",sort);
  const r=await fetch(`${IA}/advancedsearch.php?${p}`,{signal}); if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json(); return {total:j.response.numFound,items:j.response.docs.map(d=>norm({...d,_coll:coll}))};
}
const metaCache={};
async function iaMeta(id){
  if(metaCache[id])return metaCache[id];
  const r=await fetch(`${IA}/metadata/${encodeURIComponent(id)}`); if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json(); const m=j.metadata||{}; const files=j.files||[];
  const pref=[f=>/h\.264/i.test(f.format)&&!/hd|1080|720/i.test(f.format)&&/\.mp4$/i.test(f.name),f=>/\.mp4$/i.test(f.name)&&/512kb/i.test(f.name),f=>/\.mp4$/i.test(f.name),f=>/\.webm$/i.test(f.name),f=>/\.ogv$/i.test(f.name),f=>/\.m4v$/i.test(f.name)];
  let file=null; for(const p of pref){file=files.find(p); if(file)break}
  const src=file?`${IA}/download/${encodeURIComponent(id)}/${file.name.split("/").map(encodeURIComponent).join("/")}`:null;
  const sub=files.find(f=>/\.vtt$/i.test(f.name));
  const f=films[id]||norm({identifier:id,title:m.title});
  Object.assign(f,{title:plain(Array.isArray(m.title)?m.title[0]:m.title)||f.title,desc:plain(m.description)||f.desc,year:(m.year||String(m.date||"").slice(0,4)||f.year||"").toString().slice(0,4),
    runtime:m.runtime?String(m.runtime):f.runtime,creator:plain(m.creator),lang:plain(m.language),license:m.licenseurl||"",subj:(Array.isArray(m.subject)?m.subject:(m.subject?String(m.subject).split(/[;,]/):[])).map(s=>s.trim()).filter(Boolean).slice(0,6)});
  if(file&&file.length&&!f.runtime)f.runtime=String(Math.round(+file.length/60))+" min";
  return metaCache[id]={film:f,src,sub:sub?`${IA}/download/${encodeURIComponent(id)}/${sub.name.split("/").map(encodeURIComponent).join("/")}`:null};
}
function rt(s){if(!s)return ""; s=String(s); let m=s.match(/^(\d+):(\d{2}):(\d{2})$/); if(m)return `${+m[1]} h ${m[2]}`; m=s.match(/^(\d+):(\d{2})$/); if(m)return `${m[1]} min`; m=s.match(/(\d+)\s*min/i); if(m){const n=+m[1]; return n>=60?`${Math.floor(n/60)} h ${String(n%60).padStart(2,"0")}`:`${n} min`} return s.length<12?s:""}

/* ---------- grain ---------- */
(function(){const c=document.createElement("canvas"); c.width=c.height=140; const x=c.getContext("2d"),d=x.createImageData(140,140); for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255} x.putImageData(d,0,0); document.documentElement.style.setProperty("--grain",`url(${c.toDataURL()})`)})();

/* ---------- état ---------- */
let progress=store.get("progress",{}), mylist=store.get("list",[]), view="home";
const settings=store.get("settings",{low:false});
function applySettings(){document.documentElement.setAttribute("data-low-spec",settings.low?"true":"false"); $("#lowspec").setAttribute("aria-checked",String(settings.low))}
applySettings();
Object.values(progress).forEach(p=>p.f&&norm(p.f)); mylist.forEach(f=>norm(f));
const snap=f=>({identifier:f.id,title:f.title,year:f.year,runtime:f.runtime});
function toast(msg){const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<i>${I.check}</i>${esc(msg)}`; $("#toasts").append(el); setTimeout(()=>{el.classList.add("out"); el.addEventListener("animationend",()=>el.remove(),{once:true})},2400)}

function toggleList(id){const i=mylist.findIndex(f=>f.identifier===id); if(i>-1){mylist.splice(i,1); toast("Retiré de Ma liste")} else {mylist.unshift(snap(films[id])); toast("Ajouté à Ma liste")} store.set("list",mylist); return i<0}

/* ---------- cartes ---------- */
const imgFail="this.closest('.art').classList.add('noimg');this.remove()";

function card(f,opt={}){
  const p=progress[f.id];
  return `<button class="card" data-open="${esc(f.id)}" aria-label="${esc(f.title)}">${art(f,`<span class="t">${esc(f.title)}</span>`)}
    ${opt.progress&&p?`<div class="pg"><i style="width:${Math.min(100,p.t/(p.d||1)*100)}%"></i></div><div class="sub">${p.d?Math.max(1,Math.round((p.d-p.t)/60))+" min restantes":"En cours"}</div>`:""}
    ${f.desc?`<div class="info">${esc(f.desc.slice(0,160))}</div>`:""}</button>`;

function skel(n=6){return Array.from({length:n},()=>`<div class="card skel" aria-hidden="true"><div class="art"></div></div>`).join("")}
function rank(f,n){return `<button class="rank" data-open="${esc(f.id)}" aria-label="${n}. ${esc(f.title)}"><span class="n">${n}</span>${art(f).replace(/<span class="yr">.*?<\/span>/,"")}</button>`}
function rowShell(key,title,more){return `<section class="section" data-row="${key}"><div class="sec-head"><h2>${esc(title)}</h2>${more?`<button data-more="${more}">Tout voir</button>`:""}</div><div class="rail-wrap"><button class="arrow l" aria-label="Précédent" disabled>${I.l}</button><div class="rail">${skel()}</div><button class="arrow r" aria-label="Suivant">${I.r}</button></div></section>`}
function fillRow(sec,html){const r=$(".rail",sec); r.innerHTML=html; wireRail($(".rail-wrap",sec))}
function wireRail(w){const r=$(".rail",w),L=$(".arrow.l",w),R=$(".arrow.r",w); const upd=()=>{L.disabled=r.scrollLeft<8; R.disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-8}; upd(); r.onscroll=upd; L.onclick=()=>r.scrollBy({left:-r.clientWidth*.85,behavior:"smooth"}); R.onclick=()=>r.scrollBy({left:r.clientWidth*.85,behavior:"smooth"})}
function rowError(sec,retry){$(".rail",sec).innerHTML=`<div class="status err" style="padding:10px 0"><h3>Chargement impossible</h3><p style="margin:0">Internet Archive ne répond pas. Vérifiez votre connexion puis réessayez.</p><button class="btn ghost" style="height:40px">Réessayer</button></div>`; $(".rail button.btn",sec).onclick=retry}

/* ---------- accueil ---------- */
let heroList=[], hi=0, heroTimer=null; const HERO_MS=9000;
function renderHome(){
  $("#app").innerHTML=`<section class="hero" id="hero"><div class="bg" id="heroBg"></div><div class="grain"></div>
    <div class="hero-in"><div class="hero-txt" id="heroTxt"><div class="eyebrow"><b>Domaine public</b><span>Chargement du catalogue…</span></div><h1 style="opacity:.25">Lumen</h1><p>Des milliers de films libres, du cinéma muet aux séries B de science-fiction.</p></div><div class="frame" id="heroFrame" hidden></div></div>
    <div class="dots" id="dots"></div></section>
    <main class="view-in" id="rows">
      ${Object.keys(progress).length?rowShell("resume","Reprendre"):""}
      ${rowShell("top","Top 10 des plus regardés")}
      ${mylist.length?rowShell("list","Ma liste","list"):""}
      ${COLLS.map(c=>rowShell(c.id,c.name,c.id)).join("")}
    </main>
    <footer class="foot">Films issus des collections publiques d'<a href="https://archive.org/details/moviesandfilms" target="_blank" rel="noopener">Internet Archive</a>, majoritairement dans le domaine public. Le statut de chaque film est indiqué sur sa page d'origine.</footer>`;
  wireRail($$(".rail-wrap")[0]);
  const resume=$('[data-row="resume"]'); if(resume)fillRow(resume,Object.values(progress).sort((a,b)=>b.at-a.at).map(p=>card(films[p.f.identifier],{progress:true})).join(""));
  const ml=$('[data-row="list"]'); if(ml)fillRow(ml,mylist.map(f=>card(films[f.identifier])).join(""));
  const loadTop=()=>iaSearch({coll:"feature_films",rows:24}).then(({items})=>{
    const top=items.slice(0,10); const s=$('[data-row="top"]'); if(s)fillRow(s,top.map((f,i)=>rank(f,i+1)).join(""));
    heroList=items.slice(10,15).length?items.slice(10,15):items.slice(0,5); startHero();
  }).catch(()=>{const s=$('[data-row="top"]'); if(s)rowError(s,loadTop); $("#heroTxt .eyebrow span").textContent="Catalogue indisponible"});
  loadTop();
  COLLS.forEach((c,i)=>{const go=()=>iaSearch({coll:c.id,rows:20,page:1+(c.id==="feature_films"?1:0)}).then(({items})=>{const s=$(`[data-row="${c.id}"]`); if(s)fillRow(s,items.map(f=>card(f)).join(""))}).catch(()=>{const s=$(`[data-row="${c.id}"]`); if(s)rowError(s,go)}); setTimeout(go,i*120)});
}
function startHero(){
  $("#dots").innerHTML=heroList.map((f,i)=>`<button aria-label="${esc(f.title)}" data-i="${i}"></button>`).join("");
  heroList.forEach(f=>{const im=new Image(); im.src=thumb(f.id)}); setHero(0);
}
function setHero(i){
  if(!heroList.length||!$("#heroBg"))return; hi=(i+heroList.length)%heroList.length; const f=heroList[hi];
  const bg=$("#heroBg"); const im=new Image(); im.alt=""; im.src=thumb(f.id); bg.append(im); requestAnimationFrame(()=>requestAnimationFrame(()=>im.classList.add("on")));
  $$("img",bg).slice(0,-1).forEach(o=>{o.classList.remove("on"); setTimeout(()=>o.remove(),1300)});
  const fr=$("#heroFrame"); fr.hidden=false; fr.className="frame swap"; void fr.offsetWidth; fr.innerHTML=`<img src="${thumb(f.id)}" alt=""><div class="grain"></div>`;
  const p=progress[f.id];
  $("#heroTxt").innerHTML=`<div class="swap" style="display:grid;gap:18px">
    <div class="eyebrow"><b>Domaine public</b><span>Les plus regardés</span></div>
    <h1>${esc(f.title)}</h1>
    <div class="meta">${f.year?`<span>${esc(f.year)}</span>`:""}${rt(f.runtime)?`<span>${esc(rt(f.runtime))}</span>`:""}<span class="pill">VO</span><span class="mono">${f.dl.toLocaleString("fr-FR")} visionnages</span></div>
    ${f.desc?`<p>${esc(f.desc)}</p>`:""}
    <div class="actions"><button class="btn play" data-play="${esc(f.id)}">${I.play}${p?"Reprendre":"Lecture"}</button><button class="btn ghost" data-open="${esc(f.id)}">${I.info}Plus d'infos</button></div></div>`;
  $$("#dots button").forEach((b,j)=>{b.classList.remove("on"); void b.offsetWidth; if(j===hi){b.classList.add("on"); b.style.setProperty("--dur",HERO_MS+"ms")}});
  clearTimeout(heroTimer); heroTimer=setTimeout(()=>{if(view==="home"&&!document.hidden)setHero(hi+1)},HERO_MS);
}
document.addEventListener("mouseover",e=>{const hero=$("#hero"); if(!hero||!heroList.length)return; const over=!!(e.target.closest&&e.target.closest(".hero-txt"));
  if(over&&!hero.classList.contains("paused")){hero.classList.add("paused"); clearTimeout(heroTimer)} else if(!over&&hero.classList.contains("paused")){hero.classList.remove("paused"); heroTimer=setTimeout(()=>setHero(hi+1),3500)}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&view==="home"&&heroList.length){clearTimeout(heroTimer); heroTimer=setTimeout(()=>setHero(hi+1),HERO_MS)}});

/* ---------- grille (tous les films / collection / ma liste) ---------- */
let gridState=null, io=null;
function renderGrid(kind,coll=""){
  if(io)io.disconnect();
  if(kind==="list"){
    $("#app").innerHTML=`<div class="view-in"><div class="page-head"><h1>Ma liste</h1></div>${mylist.length?`<div class="grid">${mylist.map(f=>card(films[f.identifier])).join("")}</div>`:`<div class="status"><h3>Votre liste est vide</h3><p style="margin:0">Ajoutez un film avec le bouton + sur sa fiche, il apparaîtra ici.</p><button class="btn ghost" data-view="films">Parcourir les films</button></div>`}</div>`; return;
  }
  const sorts=[["downloads desc","Populaires"],["year asc","Plus anciens"],["year desc","Plus récents"],["titleSorter asc","A → Z"]];
  gridState={coll,sort:gridState&&gridState.coll===coll?gridState.sort:"downloads desc",page:0,done:false,loading:false,total:0};
  const name=coll?COLLS.find(c=>c.id===coll).name:"Tous les films";
  $("#app").innerHTML=`<div class="view-in"><div class="page-head"><h1>${esc(name)}</h1><p id="count">Chargement…</p>
    <div class="chips"><button class="chip" data-coll="" aria-pressed="${!coll}">Tout</button>${COLLS.map(c=>`<button class="chip" data-coll="${c.id}" aria-pressed="${coll===c.id}">${esc(c.name)}</button>`).join("")}</div>
    <div class="chips">${sorts.map(([v,l])=>`<button class="chip" data-sort="${v}" aria-pressed="${gridState.sort===v}">${l}</button>`).join("")}</div></div>
    <div class="grid" id="grid"></div><div class="status" id="more"><div class="spin"></div></div></div>`;
  const loadMore=async()=>{const g=gridState; if(g.loading||g.done)return; g.loading=true; g.page++; const sk=document.createElement("div"); sk.style.display="contents"; sk.innerHTML=skel(6); $("#grid").append(sk);
    try{const {total,items}=await iaSearch({coll:g.coll,sort:g.sort,rows:36,page:g.page}); if(g!==gridState)return; sk.remove(); g.total=total;
      $("#count").textContent=`${total.toLocaleString("fr-FR")} films disponibles`; $("#grid").insertAdjacentHTML("beforeend",items.map(f=>card(f)).join(""));
      if(g.page*36>=total||!items.length){g.done=true; $("#more").innerHTML=total?`<p style="margin:0">Vous avez tout vu. ${total.toLocaleString("fr-FR")} films.</p>`:`<h3>Aucun film ici</h3>`}}
    catch(e){if(g!==gridState)return; sk.remove(); g.page--; $("#more").innerHTML=`<h3 style="color:var(--err)">Chargement impossible</h3><p style="margin:0">Internet Archive ne répond pas pour le moment.</p><button class="btn ghost" id="retry" style="height:40px">Réessayer</button>`; $("#retry").onclick=()=>{$("#more").innerHTML='<div class="spin"></div>'; loadMore()}}
    finally{g.loading=false}};
  io=new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{rootMargin:"800px"}); io.observe($("#more")); loadMore();
}
function go(v,coll){
  view=v; clearTimeout(heroTimer); closeDetail(true); closeSearch();
  $$(".nav [data-view],.tabbar [data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v?"page":"false"));
  v==="home"?renderHome():renderGrid(v,coll||"");
  window.scrollTo(0,0); onScroll();
}
function onScroll(){$("#top").classList.toggle("solid",scrollY>30||view!=="home")}
addEventListener("scroll",onScroll,{passive:true});

/* ---------- fiche ---------- */
let modal=null,lastFocus=null;
async function openDetail(id){
  const f=films[id]; if(!f)return; closeDetail(true); lastFocus=document.activeElement;
  const el=document.createElement("div"); el.className="scrim";
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(f.title)}">
    <button class="icon-btn close" aria-label="Fermer">${I.close}</button>
    <div class="cover"><img class="blur" src="${thumb(id)}" alt=""><img class="fg" src="${thumb(id)}" alt="" onerror="this.remove()"><div class="grain"></div>
      <div class="cover-in"><h2>${esc(f.title)}</h2><div class="actions" style="margin:0;align-items:center">
        <button class="btn play" data-play="${esc(id)}">${I.play}${progress[id]?"Reprendre":"Lecture"}</button>
        <button class="round" id="mlBtn" aria-pressed="${inList(id)}" aria-label="Ma liste">${inList(id)?I.check:I.plus}</button>
        <a class="round" href="${IA}/details/${encodeURIComponent(id)}" target="_blank" rel="noopener" aria-label="Voir sur Internet Archive" title="Voir sur Internet Archive" style="color:var(--fg)">${I.ext}</a></div></div></div>
    <div class="sheet-body" id="sb"><div class="cols"><div style="display:grid;gap:14px"><div class="meta" id="dMeta"></div><p class="desc" id="dDesc">${esc(f.desc)}</p></div><div class="facts" id="dFacts"><div class="spin"></div></div></div>
      <div style="display:grid;gap:12px"><h3>Dans la même veine</h3><div class="similar" id="sim">${skel(3)}</div></div></div></div>`;
  document.body.append(el); document.body.classList.add("locked"); modal=el;
  const fillMeta=x=>{$("#dMeta",el).innerHTML=`${x.year?`<span>${esc(x.year)}</span>`:""}${rt(x.runtime)?`<span>${esc(rt(x.runtime))}</span>`:""}<span class="pill">VO</span>${x.dl?`<span class="mono">${x.dl.toLocaleString("fr-FR")} visionnages</span>`:""}`};
  fillMeta(f);
  $("#mlBtn",el).onclick=e=>{const on=toggleList(id); e.currentTarget.setAttribute("aria-pressed",on); e.currentTarget.innerHTML=on?I.check:I.plus};
  $(".close",el).onclick=()=>closeDetail(); el.addEventListener("click",e=>{if(e.target===el)closeDetail()});
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("open"))); setTimeout(()=>$(".close",el).focus({preventScroll:true}),60);
  try{const m=await iaMeta(id); if(modal!==el)return; const x=m.film; fillMeta(x); $("#dDesc",el).textContent=x.desc||"Aucune description fournie par Internet Archive.";
    $("#dFacts",el).innerHTML=`${x.creator?`<div>Réalisation / origine : <b>${esc(x.creator)}</b></div>`:""}${x.subj.length?`<div>Thèmes : <b>${esc(x.subj.join(", "))}</b></div>`:""}${x.lang?`<div>Langue : <b>${esc(x.lang)}</b></div>`:""}
      <div>Licence : <b>${x.license?`<a href="${esc(x.license)}" target="_blank" rel="noopener">voir la licence</a>`:"Domaine public (selon Internet Archive)"}</b></div>${m.src?"":`<div style="color:var(--err)">Aucun fichier vidéo lisible directement pour ce film.</div>`}`;
    const q=(x.subj[0]||"").replace(/[^\p{L}\p{N}\s]/gu," ").trim();
    iaSearch({q,coll:f.coll||"",rows:7}).then(({items})=>{if(modal!==el)return; const s=items.filter(o=>o.id!==id).slice(0,6); $("#sim",el).innerHTML=s.length?s.map(o=>card(o)).join(""):'<p style="color:var(--dim);margin:0">Pas de suggestion pour ce film.</p>'}).catch(()=>{$("#sim",el).innerHTML=""});
  }catch(e){if(modal!==el)return; $("#dFacts",el).innerHTML=`<div style="color:var(--err)">Détails indisponibles pour le moment.</div>`; $("#sim",el).innerHTML=""}
}
function closeDetail(instant){if(!modal)return; const el=modal; modal=null; if(!search&&!P)document.body.classList.remove("locked"); if(instant){el.remove(); return} el.classList.remove("open"); setTimeout(()=>el.remove(),450); refreshSmall(); lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})}
function refreshSmall(){
  if(view==="list"){renderGrid("list"); return}
  if(view!=="home")return; const rows=$("#rows"); if(!rows)return;
  const upsert=(key,title,html,more)=>{let s=$(`[data-row="${key}"]`); if(!html){s&&s.remove(); return} if(!s){rows.insertAdjacentHTML(key==="resume"?"afterbegin":"beforeend","");const tmp=document.createElement("div"); tmp.innerHTML=rowShell(key,title,more); s=tmp.firstElementChild; if(key==="resume")rows.prepend(s); else {const top=$('[data-row="top"]'); top?top.after(s):rows.prepend(s)}} fillRow(s,html)};
  upsert("resume","Reprendre",Object.values(progress).sort((a,b)=>b.at-a.at).map(p=>card(films[p.f.identifier],{progress:true})).join(""));
  upsert("list","Ma liste",mylist.map(f=>card(films[f.identifier])).join(""),"list");
}

/* ---------- recherche ---------- */
let search=null;
function openSearch(){
  if(search)return; const el=document.createElement("div"); el.className="search"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Recherche");
  el.innerHTML=`<div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Titre, genre, réalisateur…" autocomplete="off" spellcheck="false"><button class="icon-btn" aria-label="Fermer la recherche">${I.close}</button></div><div class="hint" id="hint">Essayez « Nosferatu », « Chaplin », « zombie » ou « noir ». Échap pour fermer.</div><div class="grid" id="res"></div>`;
  document.body.append(el); document.body.classList.add("locked"); search=el;
  const q=$("#q",el),res=$("#res",el),hint=$("#hint",el); let t=null,ctl=null;
  const run=()=>{clearTimeout(t); const v=q.value.trim(); if(!v){hint.textContent="Essayez « Nosferatu », « Chaplin », « zombie » ou « noir ». Échap pour fermer."; res.innerHTML=""; return}
    hint.innerHTML='<span class="spin" style="width:16px;height:16px"></span>Recherche…';
    t=setTimeout(async()=>{ctl&&ctl.abort(); ctl=new AbortController();
      try{const {total,items}=await iaSearch({q:v,rows:48,signal:ctl.signal}); if(search!==el)return;
        hint.textContent=total?`${total.toLocaleString("fr-FR")} résultat${total>1?"s":""}${total>48?" · les 48 plus regardés":""}`:`Aucun film ne correspond à « ${v} ». Essayez un titre original en anglais ou un genre.`;
        res.innerHTML=items.map(f=>card(f)).join("")}
      catch(e){if(e.name!=="AbortError")hint.textContent="Recherche impossible : Internet Archive ne répond pas. Réessayez dans un instant."}},320)};
  q.addEventListener("input",run); $(".search-bar .icon-btn",el).onclick=closeSearch;
  requestAnimationFrame(()=>{el.classList.add("open"); q.focus()});
}
function closeSearch(){if(!search)return; const el=search; search=null; if(!modal&&!P)document.body.classList.remove("locked"); el.classList.remove("open"); setTimeout(()=>el.remove(),350)}

/* ---------- lecteur ---------- */
let P=null;
async function play(id){
  const f=films[id]; if(!f||P)return; closeSearch(); closeDetail(true);
  const el=document.createElement("div"); el.className="player open ui"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Lecteur "+f.title);
  el.innerHTML=`<video playsinline preload="auto" crossorigin="anonymous"></video><div class="p-load" id="pLoad"><div class="spin"></div></div><div class="p-mid"><div class="p-flash" id="flash"></div></div>
  <div class="p-ui"><div class="p-top"><button class="icon-btn" id="pBack" aria-label="Quitter le lecteur">${I.back}</button><div><h3>${esc(f.title)}</h3><small>${esc([f.year,rt(f.runtime)].filter(Boolean).join(" · "))}</small></div></div>
    <div class="p-bot"><div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Position de lecture" aria-valuemin="0"><div class="tr"><div class="bf"></div><div class="fl"></div><div class="kn"></div></div><div class="tip mono">0:00</div></div>
      <div class="p-ctrl"><button class="icon-btn" id="pPlay" aria-label="Lecture">${I.play}</button><button class="icon-btn" id="pRw" aria-label="Reculer de 10 secondes">${I.rw}</button><button class="icon-btn" id="pFf" aria-label="Avancer de 10 secondes">${I.ff}</button>
        <div class="vol"><button class="icon-btn" id="pMute" aria-label="Couper le son">${I.vol}</button><input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
        <span class="time mono" id="pTime">0:00 / 0:00</span><span class="sp"></span><button class="speed" id="pSpeed" aria-label="Vitesse de lecture">1×</button><button class="icon-btn" id="pFull" aria-label="Plein écran">${I.full}</button></div></div></div>`;
  document.body.append(el); document.body.classList.add("locked");
  const v=$("video",el); let hideT;
  const fmt=s=>{s=Math.max(0,Math.floor(s||0)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0"); return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
  const persist=()=>{if(!v.duration||v.currentTime<5)return; if(v.duration-v.currentTime<30){delete progress[id]} else progress[id]={f:snap(f),t:Math.floor(v.currentTime),d:Math.floor(v.duration),at:Date.now()}; store.set("progress",progress)};
  const close=()=>{if(!P)return; persist(); clearTimeout(hideT); clearInterval(saveT); v.pause(); v.removeAttribute("src"); v.load(); P=null; if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}); el.classList.remove("open"); setTimeout(()=>el.remove(),400); if(!modal&&!search)document.body.classList.remove("locked"); refreshSmall()};
  const poke=()=>{el.classList.add("ui"); clearTimeout(hideT); hideT=setTimeout(()=>{if(!v.paused&&!$("#scrub",el).classList.contains("drag"))el.classList.remove("ui")},2600)};
  const flash=ic=>{const x=$("#flash",el); x.innerHTML=ic; x.classList.remove("go"); void x.offsetWidth; x.classList.add("go")};
  const fail=msg=>{$("#pLoad",el).hidden=true; const m=document.createElement("div"); m.className="p-msg"; m.innerHTML=`<h3>Lecture impossible</h3><p style="margin:0;max-width:44ch">${esc(msg)}</p><a class="btn ghost" href="${IA}/details/${encodeURIComponent(id)}" target="_blank" rel="noopener">${I.ext}Ouvrir sur Internet Archive</a>`; el.append(m); el.classList.add("ui")};
  P={el,key:e=>{const k=e.key; if(k===" "||k==="k"){e.preventDefault(); toggle()} else if(k==="ArrowLeft"){e.preventDefault(); v.currentTime-=10; flash(I.rw)} else if(k==="ArrowRight"){e.preventDefault(); v.currentTime+=10; flash(I.ff)} else if(k==="ArrowUp"){e.preventDefault(); v.volume=Math.min(1,v.volume+.1)} else if(k==="ArrowDown"){e.preventDefault(); v.volume=Math.max(0,v.volume-.1)} else if(k==="m"){v.muted=!v.muted} else if(k==="f"){$("#pFull",el).click()} else if(k==="Escape"&&!document.fullscreenElement){close()} poke()}};
  const toggle=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
  $("#pBack",el).onclick=close; $("#pPlay",el).onclick=toggle; v.addEventListener("click",toggle);
  $("#pRw",el).onclick=()=>{v.currentTime-=10; flash(I.rw)}; $("#pFf",el).onclick=()=>{v.currentTime+=10; flash(I.ff)};
  $("#pMute",el).onclick=()=>{v.muted=!v.muted}; $("#pVol",el).oninput=e=>{v.volume=+e.target.value; v.muted=v.volume===0};
  v.addEventListener("volumechange",()=>{$("#pMute",el).innerHTML=v.muted||v.volume===0?I.mute:I.vol; $("#pVol",el).value=v.muted?0:v.volume});
  const speeds=[1,1.25,1.5,2,.75]; let si=0; $("#pSpeed",el).onclick=()=>{si=(si+1)%speeds.length; v.playbackRate=speeds[si]; $("#pSpeed",el).textContent=speeds[si].toString().replace(".",",")+"×"};
  $("#pFull",el).onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():(el.requestFullscreen?el.requestFullscreen():v.webkitEnterFullscreen&&v.webkitEnterFullscreen())}catch(e){}};
  v.addEventListener("play",()=>{$("#pPlay",el).innerHTML=I.pause; $("#pPlay",el).setAttribute("aria-label","Pause"); flash(I.play); poke()});
  v.addEventListener("pause",()=>{$("#pPlay",el).innerHTML=I.play; $("#pPlay",el).setAttribute("aria-label","Lecture"); flash(I.pause); el.classList.add("ui"); persist()});
  v.addEventListener("waiting",()=>{$("#pLoad",el).hidden=false}); v.addEventListener("playing",()=>{$("#pLoad",el).hidden=true}); v.addEventListener("canplay",()=>{$("#pLoad",el).hidden=true});
  const ui=()=>{const d=v.duration||0,c=v.currentTime||0; const pc=d?c/d*100:0; $(".fl",el).style.width=pc+"%"; $(".kn",el).style.left=pc+"%"; let b=0; for(let i=0;i<v.buffered.length;i++)if(v.buffered.start(i)<=c)b=v.buffered.end(i); $(".bf",el).style.width=(d?b/d*100:0)+"%"; $("#pTime",el).textContent=`${fmt(c)} / ${fmt(d)}`; const sc=$("#scrub",el); sc.setAttribute("aria-valuemax",Math.floor(d)); sc.setAttribute("aria-valuenow",Math.floor(c)); sc.setAttribute("aria-valuetext",fmt(c))};
  v.addEventListener("timeupdate",ui); v.addEventListener("progress",ui); v.addEventListener("loadedmetadata",()=>{const p=progress[id]; if(p&&p.t<v.duration-30){v.currentTime=p.t; toast("Reprise à "+fmt(p.t))} ui()});
  v.addEventListener("ended",()=>{delete progress[id]; store.set("progress",progress); el.classList.add("ui"); toast("Film terminé")});
  v.addEventListener("error",()=>{if(v.getAttribute("src"))fail("Le fichier vidéo de ce film n'a pas pu être chargé. Il est peut-être indisponible ou dans un format que votre navigateur ne lit pas.")});
  el.addEventListener("pointermove",poke);
  const sc=$("#scrub",el),tip=$(".tip",sc); const at=e=>{const r=$(".tr",sc).getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  sc.addEventListener("pointermove",e=>{const x=at(e); tip.style.left=x*100+"%"; tip.textContent=fmt(x*(v.duration||0))});
  sc.addEventListener("pointerdown",e=>{if(!v.duration)return; sc.setPointerCapture(e.pointerId); sc.classList.add("drag"); v.currentTime=at(e)*v.duration; ui();
    const mv=e2=>{v.currentTime=at(e2)*v.duration; ui()},up=()=>{sc.classList.remove("drag"); sc.removeEventListener("pointermove",mv); sc.removeEventListener("pointerup",up); poke()}; sc.addEventListener("pointermove",mv); sc.addEventListener("pointerup",up)});
  sc.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight")e.stopPropagation()});
  const saveT=setInterval(persist,15000);
  poke();
  try{const m=await iaMeta(id); if(P?.el!==el)return; if(!m.src){fail("Internet Archive ne propose pas de fichier vidéo lisible directement pour ce film."); return}
    v.removeAttribute("crossorigin"); v.src=m.src;
    if(m.sub){const tr=document.createElement("track"); tr.kind="subtitles"; tr.src=m.sub; tr.srclang="und"; tr.label="Sous-titres"; v.append(tr)}
    v.play().catch(()=>{$("#pLoad",el).hidden=true; el.classList.add("ui")});
  }catch(e){if(P?.el===el)fail("Impossible de joindre Internet Archive. Vérifiez votre connexion puis réessayez.")}
}

/* ---------- événements ---------- */
document.addEventListener("click",e=>{
  const pl=e.target.closest("[data-play]"); if(pl){e.stopPropagation(); play(pl.dataset.play); return}
  const op=e.target.closest("[data-open]"); if(op){openDetail(op.dataset.open); return}
  const v=e.target.closest("[data-view]"); if(v){go(v.dataset.view); return}
  const mo=e.target.closest("[data-more]"); if(mo){mo.dataset.more==="list"?go("list"):go("films",mo.dataset.more); return}
  const cl=e.target.closest("[data-coll]"); if(cl){gridState=null; renderGrid("films",cl.dataset.coll); return}
  const so=e.target.closest("[data-sort]"); if(so&&gridState){const c=gridState.coll; gridState.sort=so.dataset.sort; const s=gridState.sort; renderGrid("films",c); return}
  if(e.target.closest("[data-search]")){openSearch(); return}
  const dot=e.target.closest("#dots button"); if(dot){setHero(+dot.dataset.i); return}
  const menu=$("#menu"); if(e.target.closest("#avatar")){menu.hidden=!menu.hidden; $("#avatar").setAttribute("aria-expanded",String(!menu.hidden)); return}
  if(!e.target.closest("#menu"))menu.hidden=true;
});
$("#lowspec").onclick=()=>{settings.low=!settings.low; store.set("settings",settings); applySettings(); toast(settings.low?"Mode économie activé":"Effets complets réactivés")};
$("#clearHist").onclick=()=>{progress={}; store.set("progress",progress); refreshSmall(); toast("Historique effacé")};
document.addEventListener("keydown",e=>{
  if(P){P.key(e); return}
  if(e.key==="Escape"){if(search)closeSearch(); else if(modal)closeDetail(); else $("#menu").hidden=true; return}
  if(e.key==="/"&&!search&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault(); openSearch()}
});
go("home");
})();
</script>
</body>
